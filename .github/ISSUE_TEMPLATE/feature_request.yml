name: ✨ Feature Request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the problem you're trying to solve.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user-facing problem does this solve? Be specific about the workflow.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the feature behave? UI, CLI, or config surface?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or partial solutions you've tried?
  - type: dropdown
    id: scope
    attributes:
      label: Where does this belong?
      options:
        - GUI (customtkinter)
        - Classification / rules engine
        - Monitoring / watcher
        - Cleanup / dedup / health
        - AI assistant (ollama)
        - General / not sure
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this feature
          required: true