name: 🐛 Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of actions that triggers the bug.
      placeholder: |
        1. Start FileManager with ...
        2. Add a rule for ...
        3. Drop a file into ...
        4. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste any console output, traceback, or log viewer output here.
      render: shell
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version (if running from source)
      placeholder: e.g. 3.12.9
  - type: dropdown
    id: runmode
    attributes:
      label: How are you running the app?
      options:
        - Packaged executable (EXE)
        - From source (python -m src.main)
  - type: textarea
    id: config
    attributes:
      label: Config / rules (redact personal paths)
      description: Only if relevant to the bug. Do NOT paste full paths to personal files.
      render: yaml
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this bug
          required: true
        - label: I am on the latest release
          required: false